<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실시간 베스트셀러</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    :root {
      --kyobo: #4DAC27; --aladin: #A2052C; --yes24: #020287; --total: #8e44ad;
      --will: #E91E63; --will-jr: #FF9800; --will-art: #9C27B0;
      --ink: #191F28; --sub: #4E5968; --mut: #8B95A1; --line: #F2F4F6;
      --bg: #F9FAFB; --card: #fff; --up: #F04452; --down: #3182F6; --new: #FF9800;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg); color: var(--ink);
      -webkit-font-smoothing: antialiased; letter-spacing: -0.02em;
    }

    /* ===== 헤더 ===== */
    .header { background: var(--card); border-bottom: 1px solid var(--line); padding: 18px 0 0; }
    .header-inner { max-width: 1120px; margin: 0 auto; padding: 0 24px; }
    .brand-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    .logo { font-size: 11px; color: var(--store-color); font-weight: 600; letter-spacing: 0; }
    h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.03em; }
    .live-tag { font-size: 12px; color: var(--mut); text-align: right; line-height: 1.5; }
    .live-tag .dot { color: var(--kyobo); }

    .main-tabs { display: flex; gap: 18px; }
    .mtab { padding: 8px 0 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--mut); border-bottom: 2.5px solid transparent; }
    .mtab.active { color: var(--ink); border-bottom-color: var(--ink); }

    .container { max-width: 1120px; margin: 0 auto; padding: 20px 24px; }

    /* ===== 요약 카드 ===== */
    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
    .sum-card { border-radius: 16px; padding: 14px 15px; }
    .sum-card.pink { background: #FCEAF1; }
    .sum-card.plain { background: var(--card); border: 1px solid var(--line); }
    .sum-label { font-size: 12px; font-weight: 500; margin-bottom: 4px; }
    .sum-value { font-size: 23px; font-weight: 700; letter-spacing: -0.04em; line-height: 1.1; }
    .sum-unit { font-size: 13px; font-weight: 500; }
    .sum-sub { font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ===== 서점 탭 (알약형, CI 컬러) ===== */
    .store-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .store-tab { flex: 1; text-align: center; font-size: 14px; font-weight: 600; color: var(--sub); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 0; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .store-tab.active { color: #fff; border-color: transparent; }
    .store-tab[data-store="kyobo"].active { background: var(--kyobo); }
    .store-tab[data-store="aladin"].active { background: var(--aladin); }
    .store-tab[data-store="yes24"].active { background: var(--yes24); }
    .store-tab[data-store="total"].active { background: var(--total); }

    /* ===== 분야 하위 탭 (칩) ===== */
    .cat-tabs { display: flex; gap: 7px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 3px; -ms-overflow-style: none; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab { font-size: 13px; font-weight: 500; color: var(--sub); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 7px 14px; cursor: pointer; white-space: nowrap; transition: all 0.15s; }
    .cat-tab.active { color: var(--store-color); background: var(--store-tint); border-color: transparent; font-weight: 600; }
    .cat-tab.disabled { opacity: 0.4; cursor: not-allowed; }

    /* ===== 툴바 ===== */
    .toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .time-value { font-size: 12px; color: var(--mut); font-weight: 500; }
    .refresh-btn { background: none; border: none; font-size: 15px; cursor: pointer; color: var(--mut); padding: 2px; display: inline-flex; }
    .refresh-btn.spinning { animation: spin 0.8s linear infinite; pointer-events: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-wrap { flex: 1; display: flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 13px; }
    .search-wrap:focus-within { border-color: var(--store-color); }
    .search-wrap svg { flex-shrink: 0; }
    .search-input { border: none; background: none; outline: none; font-family: inherit; font-size: 13px; width: 100%; color: var(--ink); letter-spacing: -0.02em; }
    .filter-btn { font-size: 12px; font-weight: 600; color: var(--will); background: #FCEAF1; border: none; border-radius: 20px; padding: 8px 13px; cursor: pointer; white-space: nowrap; }
    .filter-btn.active { background: var(--will); color: #fff; }

    /* ===== 순위 리스트 ===== */
    /* ===== 통합 리스트: 표지 왼쪽 + 서지정보 오른쪽 ===== */
    .books-list-view { display: flex; flex-direction: column; gap: 8px; }
    .book-item { display: flex; align-items: flex-start; gap: 13px; background: var(--card); border-radius: 16px; padding: 14px; cursor: pointer; transition: all 0.12s; }
    .book-item:active { transform: scale(0.99); }
    .book-item.highlight { background: var(--will-tint); }
    .book-item.hidden { display: none !important; }
    .cover { width: 62px; height: 88px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: var(--line); position: relative; box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover.skeleton::after { content: '준비중'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--mut); }
    .rank-badge { position: absolute; top: 0; left: 0; background: var(--store-color); color: #fff; font-size: 11px; font-weight: 700; padding: 2px 6px; border-bottom-right-radius: 7px; letter-spacing: -0.03em; }
    .rank-badge.top3 { background: var(--will); }
    .book-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding-top: 1px; }
    .bi-top { display: flex; align-items: center; gap: 6px; }
    .change-badge { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 1px; }
    .change-badge.up { color: var(--up); }
    .change-badge.down { color: var(--down); }
    .change-badge.new { color: var(--new); }
    .change-badge.same { color: var(--mut); }
    .change-badge.pts { color: var(--total); font-size: 11px; }
    .book-title { font-size: 14px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .book-author { font-size: 12px; color: var(--sub); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
    .book-sub { font-size: 11.5px; color: var(--mut); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
    .our-badge { font-size: 11px; font-weight: 600; color: #fff; border-radius: 5px; padding: 1px 6px; flex-shrink: 0; }
    .store-badge-mini { font-size: 10px; padding: 1px 5px; border-radius: 5px; color: #fff; font-weight: 600; }
    .book-link { margin-top: 3px; }
    .book-link a { font-size: 11px; color: var(--store-color); text-decoration: none; border: 1px solid var(--store-color); border-radius: 8px; padding: 3px 9px; font-weight: 600; white-space: nowrap; display: inline-block; }

    .loading, .error, .empty-msg { text-align: center; padding: 60px 20px; color: var(--mut); font-size: 14px; }
    .error { color: var(--up); }

    /* ===== 급상승/신규진입 하이라이트 ===== */
    .highlight-section { margin-bottom: 16px; }
    .hl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    @media (max-width: 560px) { .hl-grid { grid-template-columns: 1fr; } }
    .hl-box { background: var(--card); border-radius: 16px; padding: 14px 16px; }
    .hl-box-title { font-size: 13px; font-weight: 700; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
    .hl-box.up .hl-box-title { color: var(--up); }
    .hl-box.new .hl-box-title { color: var(--new); }
    .hl-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; cursor: pointer; min-width: 0; }
    .hl-row + .hl-row { border-top: 1px solid var(--line); }
    .hl-rank { font-size: 13px; font-weight: 700; min-width: 26px; text-align: center; color: var(--sub); flex-shrink: 0; letter-spacing: -0.03em; }
    .hl-info { flex: 1 1 0; min-width: 0; overflow: hidden; }
    .hl-title { font-size: 12.5px; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hl-sub { font-size: 10.5px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hl-badge { font-size: 11px; font-weight: 700; flex-shrink: 0; padding: 2px 8px; border-radius: 20px; }
    .hl-badge.up { color: var(--up); background: #FDECEE; }
    .hl-badge.new { color: var(--new); background: #FFF3E0; }
    .hl-empty { font-size: 12px; color: var(--mut); padding: 10px 0; text-align: center; }

    /* ===== 지난 차트 ===== */
    .history-list { display: flex; flex-direction: column; gap: 7px; }
    .history-item { background: var(--card); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .history-item.has-ours { background: var(--will-tint); }
    .history-time { font-weight: 700; font-size: 14px; letter-spacing: -0.02em; }
    .history-top { font-size: 12px; color: var(--sub); margin-top: 2px; }
    .history-our-badge { font-size: 10px; font-weight: 600; color: #fff; background: var(--will); border-radius: 5px; padding: 1px 6px; margin-top: 4px; display: inline-block; }
    .back-btn { background: none; border: none; color: var(--sub); font-size: 14px; cursor: pointer; margin-bottom: 14px; padding: 0; font-family: inherit; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* ===== 모달 ===== */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 6vh 16px; opacity: 0; transition: opacity 0.2s; }
    .modal-overlay.show { display: flex; opacity: 1; }
    .modal-content { background: var(--card); width: 100%; max-width: 440px; border-radius: 22px; padding: 22px; position: relative; max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,0.16); }
    .modal-close { position: absolute; top: 18px; right: 18px; font-size: 22px; cursor: pointer; color: var(--mut); background: none; border: none; line-height: 1; }
    .modal-header { margin-bottom: 16px; padding-right: 24px; }
    .modal-badge-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .modal-title { font-size: 18px; font-weight: 700; line-height: 1.3; letter-spacing: -0.03em; }
    .modal-author { font-size: 13px; color: var(--sub); font-weight: 500; margin-top: 2px; }

    /* 세 서점 순위 카드 */
    .store-rank-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; margin-bottom: 16px; }
    .srg-card { border-radius: 12px; padding: 10px 8px; text-align: center; }
    .srg-card.kyobo { background: #E8F5E1; } .srg-label.kyobo { color: #2E7D14; }
    .srg-card.aladin { background: #FBE7EB; } .srg-label.aladin { color: #A2052C; }
    .srg-card.yes24 { background: #E5EAF7; } .srg-label.yes24 { color: #020287; }
    .srg-label { font-size: 11px; font-weight: 600; }
    .srg-value { font-size: 19px; font-weight: 700; letter-spacing: -0.04em; margin-top: 1px; }
    .srg-value.none { color: var(--mut); font-size: 14px; font-weight: 500; }
    .srg-unit { font-size: 11px; font-weight: 500; }

    .trend-view-toggle { display: flex; gap: 4px; background: var(--line); border-radius: 12px; padding: 4px; margin-bottom: 16px; }
    .trend-view-btn { flex: 1; padding: 8px 0; border-radius: 9px; border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--sub); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 5px; }
    .trend-view-btn.active { background: var(--card); color: var(--store-color); }

    .trend-chart-wrap { position: relative; height: 260px; }
    .trend-chart-empty { padding: 50px 20px; text-align: center; color: var(--mut); font-size: 13px; line-height: 1.7; }

    #trendChartView { flex-shrink: 0; }
    .trend-list { display: flex; flex-direction: column; gap: 7px; overflow-y: auto; padding-right: 4px; flex: 1 1 auto; min-height: 0; }
    .trend-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: var(--bg); border-radius: 12px; font-size: 14px; }
    .trend-item.is-top { background: var(--will-tint); }
    .trend-time { color: var(--sub); font-weight: 600; font-size: 13px; }
    .trend-rank { font-weight: 700; font-size: 16px; color: var(--store-color); letter-spacing: -0.03em; }
    .trend-rank.none { color: var(--mut); font-weight: 500; font-size: 13px; }
    .trend-stores { display: flex; gap: 4px; }

    /* 최근 이슈 */
    #trendIssues { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
    .trend-list::-webkit-scrollbar, #trendIssues::-webkit-scrollbar { width: 5px; }
    .trend-list::-webkit-scrollbar-thumb, #trendIssues::-webkit-scrollbar-thumb { background: #D1D6DB; border-radius: 3px; }
    .issue-meta { font-size: 12px; color: var(--mut); margin-bottom: 10px; display: flex; align-items: center; gap: 5px; font-weight: 500; }
    .issue-list { display: flex; flex-direction: column; gap: 7px; padding-right: 4px; }
    .issue-card { display: block; text-decoration: none; color: var(--ink); background: var(--bg); border-radius: 12px; padding: 12px 14px; transition: background 0.12s; }
    .issue-card:active { background: var(--line); }
    .issue-title { font-size: 13.5px; font-weight: 600; line-height: 1.4; letter-spacing: -0.02em; margin-bottom: 4px; }
    .issue-snippet { font-size: 12px; color: var(--sub); line-height: 1.45; margin-bottom: 6px; }
    .issue-foot { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .issue-source { color: var(--store-color); font-weight: 600; }
    .issue-time { color: var(--mut); }
    .issue-foot .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--mut); }
    .issue-empty { padding: 40px 20px; text-align: center; color: var(--mut); font-size: 13px; line-height: 1.7; }
    .issue-empty small { color: var(--mut); }
    .issue-more { margin-top: 12px; text-align: center; }
    .issue-more a { font-size: 12px; color: var(--store-color); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--store-color); padding-bottom: 1px; }

    /* 통합 점수 툴팁 */
    .info-wrap { position: relative; display: inline-flex; align-items: center; }
    .info-icon { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%; border: 1px solid currentColor; font-size: 10px; font-weight: 700; margin-left: 5px; cursor: help; opacity: 0.8; font-style: italic; line-height: 1; }
    .info-tip { position: absolute; top: calc(100% + 10px); right: 0; width: 250px; background: #2C2C2E; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 12px; font-weight: 400; line-height: 1.6; opacity: 0; visibility: hidden; transform: translateY(-4px); transition: all 0.15s; z-index: 100; text-align: left; letter-spacing: -0.01em; }
    .info-tip::after { content: ''; position: absolute; bottom: 100%; right: 14px; border: 6px solid transparent; border-bottom-color: #2C2C2E; }
    .info-wrap:hover .info-tip, .info-tip.show { opacity: 1; visibility: visible; transform: translateY(0); }
    .info-tip b { color: #FFD479; font-weight: 700; }
    .info-tip .tip-title { display: block; font-weight: 700; margin-bottom: 5px; }
    .info-tip .tip-formula { display: block; background: rgba(255,255,255,0.1); border-radius: 6px; padding: 5px 8px; margin: 6px 0; }
    @media (max-width: 560px) { .info-tip { right: -80px; width: 210px; } .info-tip::after { right: 94px; } }

    .footer { text-align: center; padding: 36px 20px; font-size: 12px; color: var(--mut); }
    .footer a { color: var(--sub); text-decoration: none; border-bottom: 1px solid var(--line); }
  </style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="brand-row">
      <div>
        <div class="logo" id="logo">REALTIME BESTSELLER by ahu(orozi)</div>
        <h1>실시간 베스트셀러</h1>
      </div>
      <div class="live-tag" id="liveTag"><span class="dot">●</span> LIVE</div>
    </div>
    <div class="main-tabs">
      <div class="mtab active" onclick="showMainTab('latest')">최신 차트</div>
      <div class="mtab" onclick="showMainTab('history')">지난 차트</div>
    </div>
  </div>
</div>

<div class="container">
  <div id="latest-view"><div class="loading">불러오는 중...</div></div>
  <div id="history-view" style="display:none"><div class="loading">불러오는 중...</div></div>
</div>

<div class="modal-overlay" id="trendModal" onclick="if(event.target===this) closeTrendModal()">
  <div class="modal-content">
    <button class="modal-close" onclick="closeTrendModal()">&times;</button>
    <div class="modal-header">
      <div class="modal-badge-row" id="modalBadgeRow"></div>
      <div class="modal-title" id="modalTitle">책 제목</div>
      <div class="modal-author" id="modalAuthor">저자</div>
    </div>
    <div class="store-rank-grid" id="storeRankGrid"></div>
    <div class="trend-view-toggle">
      <button class="trend-view-btn active" id="trendBtnChart" onclick="setTrendView('chart')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 14 4-4 3 3 5-6"/></svg>추이</button>
      <button class="trend-view-btn" id="trendBtnList" onclick="setTrendView('list')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>목록</button>
      <button class="trend-view-btn" id="trendBtnIssues" onclick="setTrendView('issues')" style="display:none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11a9 9 0 0 1 9 9M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg>최근 이슈</button>
    </div>
    <div id="trendChartView">
      <div class="trend-chart-wrap"><canvas id="trendChartCanvas"></canvas></div>
    </div>
    <div class="trend-list" id="trendList" style="display:none"></div>
    <div id="trendIssues" style="display:none"></div>
  </div>
</div>

<div class="footer">
  Data provided by orozi(ahu@willbookspub.com)<br>
</div>

<script>
const RAW = "https://raw.githubusercontent.com/orozipdf-code/orozi-test/master/";
const CSV_FILES = { kyobo: "kyobo_bestseller.csv", aladin: "aladin_bestseller.csv", yes24: "yes24_bestseller.csv" };
const STORE_COLORS = { kyobo: "#4DAC27", aladin: "#A2052C", yes24: "#020287", total: "#8e44ad" };
const STORE_TINTS  = { kyobo: "#E8F5E1", aladin: "#FBE7EB", yes24: "#E5EAF7", total: "#F0E9F6" };
const STORE_NAMES  = { kyobo: "교보", aladin: "알라딘", yes24: "예스24" };

const OUR_PUBLISHERS = ["윌북주니어", "윌북아트", "윌북"];
const PUB_COLORS = { "윌북": "#E91E63", "윌북주니어": "#FF9800", "윌북아트": "#9C27B0" };
const PUB_TINTS  = { "윌북": "#FCEAF1", "윌북주니어": "#FFF3E0", "윌북아트": "#F5EBFA" };

let currentMainTab = 'latest';
let currentStore = 'kyobo';
let historyData = [];
let filterOn = false;
let searchQuery = '';
let currentView = 'list';
let searchTimeout;
let trendView = 'chart';
let trendChart = null;
let modalBookTitle = '';
let modalBookAuthor = '';
let modalBookPublisher = '';
let modalBookIsOurs = false;

const ISSUES_FILE = 'issues.json';
let issuesData = null;
const normTitle = s => (s || '').replace(/\s+/g, '').toLowerCase();

// 📚 분야별 데이터 (categories.json)
const CATEGORIES_FILE = 'categories.json';
let categoriesData = null;
let currentCat = 'all';   // 'all'=종합, 그 외=분야키
// 분야 탭을 지원하는 서점 (교보·통합은 종합만)
const CAT_STORES = ['aladin', 'yes24'];

async function loadCategories() {
  try { const res = await fetchWithRetry(RAW + CATEGORIES_FILE + '?t=' + Date.now()); categoriesData = await res.json(); }
  catch { categoriesData = null; }
}
// 현재 서점·분야에 실제 데이터가 있는지
function catHasData(store, key) {
  if (key === 'all') return true;
  return !!(categoriesData && categoriesData[store] && Array.isArray(categoriesData[store][key]) && categoriesData[store][key].length);
}

async function loadIssues() {
  try { const res = await fetchWithRetry(RAW + ISSUES_FILE + '?t=' + Date.now()); issuesData = await res.json(); }
  catch { issuesData = { books: [] }; }
}

function issueTimeAgo(pub) {
  if (!pub) return '';
  const d = new Date(pub); if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 3600) return `${Math.max(1, Math.round(diff/60))}분 전`;
  if (diff < 86400) return `${Math.round(diff/3600)}시간 전`;
  return `${Math.round(diff/86400)}일 전`;
}

      <div class="issue-more"><a href="${gLink}" target="_blank" rel="noopener">지금 구글에서 최근 1일 검색 →</a></div></div>`;

      <div class="issue-more"><a href="${gLink}" target="_blank" rel="noopener">구글에서 직접 확인 →</a></div></div>`;

function isOurPublisher(publisher) { return OUR_PUBLISHERS.some(p => publisher && publisher.includes(p)); }

function changeIcon(change, points = null) {
  if (points !== null) return { icon: `${points}점`, cls: 'pts', dir: 'pts' };
  const val = (change || '').toString().trim().toUpperCase();
  if (!val || val === '-' || val === '0' || val === '유지') return { icon: '–', cls: 'same', dir: 'same' };
  if (val === 'NEW' || val === '진입') return { icon: 'NEW', cls: 'new', dir: 'new' };
  if (val.includes('↑') || val.includes('▲') || val.includes('상승')) return { icon: val.replace(/[↑▲상승]/g,'').trim(), cls: 'up', dir: 'up' };
  if (val.includes('↓') || val.includes('▼') || val.includes('하락')) return { icon: val.replace(/[↓▼하락]/g,'').trim(), cls: 'down', dir: 'down' };
  return { icon: change, cls: 'same', dir: 'same' };
}

function changeBadgeHtml(change, points = null) {
  const { icon, cls, dir } = changeIcon(change, points);
  let arrow = '';
  if (dir === 'up') arrow = '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4l8 12H4z"/></svg>';
  if (dir === 'down') arrow = '<svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20L4 8h16z"/></svg>';
  return `<span class="change-badge ${cls}">${arrow}${icon}</span>`;
}
function cardChangeHtml(change, points = null) {
  const { icon, cls } = changeIcon(change, points);
  return `<span class="card-change ${cls}">${icon}</span>`;
}

function parseChangeDelta(change) {
  const val = (change || '').toString().trim();
  const m = val.match(/(\d+)/);
  if (!m) return 0;
  const n = parseInt(m[1]);
  if (val.includes('↑') || val.includes('▲') || val.includes('상승')) return n;
  if (val.includes('↓') || val.includes('▼') || val.includes('하락')) return -n;
  return 0;
}

function toOnTheHour(timeStr) {
  const clean = (timeStr||'').replace(/-/g, '.');
  const parts = clean.split(' ');
  if (parts.length < 2) return clean;
  const hour = parts[1].split(':')[0];
  return parts[0] + ' ' + hour + ':00';
}
function toShortTime(timeStr) {
  const clean = (timeStr || '').replace(/-/g, '.');
  const parts = clean.split(' ');
  if (parts.length < 2) return clean;
  const md = parts[0].split('.').slice(1).join('.');
  const hour = parts[1].split(':')[0];
  return `${md} ${hour}시`;
}

function applyFilters() {
  const items = document.querySelectorAll('.book-item');
  let visibleCount = 0;
  items.forEach(el => {
    const isOurs = el.dataset.ours === 'true';
    const targets = el.querySelectorAll('.book-title, .book-author, .book-sub');
    let combinedText = '';
    targets.forEach(t => combinedText += t.textContent.toLowerCase() + ' ');
    const matchesPub = !filterOn || isOurs;
    const matchesSearch = combinedText.includes(searchQuery);
    const isHidden = !(matchesPub && matchesSearch);
    el.classList.toggle('hidden', isHidden);
    if (!isHidden) visibleCount++;
  });
  const existingMsg = document.getElementById('empty-msg');
  if (visibleCount === 0) {
    if (!existingMsg) {
      const listView = document.querySelector('.books-list-view');
      if (listView) { const msg = document.createElement('div'); msg.id = 'empty-msg'; msg.className = 'empty-msg'; msg.textContent = '조건에 맞는 책이 없어요 📭'; listView.parentNode.appendChild(msg); }
    }
  } else { if (existingMsg) existingMsg.remove(); }
}

function toggleFilter() {
  filterOn = !filterOn;
  const btn = document.getElementById('filterBtn');
  if (btn) btn.classList.toggle('active', filterOn);
  applyFilters();
}

function handleSearch(e) {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { searchQuery = e.target.value.toLowerCase().trim(); applyFilters(); }, 200);
}

async function handleRefresh(btn) {
  if (btn.classList.contains('spinning')) return;
  btn.classList.add('spinning');
  await loadLatest();
}

/* ===== 통합 병합 로직 (II/2, 부제, 윌북·윌북아트) ===== */
function normPublisher(pub) {
  let p = (pub || '').trim();
  p = p.replace(/\s*[\(（].*?[\)）]\s*/g, '');
  p = p.replace(/\s+/g, '').toLowerCase();
  if (p === '윌북아트') p = '윌북';
  return p;
}
const ROMAN_NUM = { i:1, ii:2, iii:3, iv:4, v:5, vi:6, vii:7, viii:8, ix:9, x:10 };
function stripSubtitle(rawTitle) {
  let t = (rawTitle || '').trim();
  let volume = '';
  const roman = t.match(/\s(i{1,3}|iv|v|vi{0,3}|ix|x)\s*$/i);
  if (roman) volume = String(ROMAN_NUM[roman[1].toLowerCase()] || '');
  if (!volume) {
    const volPatterns = [/(\d+)\s*권/, /(\d+)\s*부/, /시즌\s*(\d+)/i, /vol\.?\s*(\d+)/i, /\b([0-9]{1,2})\b\s*$/, /\b(상|하|중)\b\s*$/];
    for (const re of volPatterns) { const m = t.match(re); if (m) { volume = m[1]; break; } }
  }
  let base = t.split(/\s*[:：]\s*/)[0];
  base = base.split(/\s+[-–—~]\s+/)[0];
  base = base.trim();
  base = base.replace(/\s*\d+\s*(권|부)\s*$/, '');
  base = base.replace(/\s*시즌\s*\d+\s*$/i, '');
  base = base.replace(/\s*vol\.?\s*\d+\s*$/i, '');
  base = base.replace(/\s+(i{1,3}|iv|v|vi{0,3}|ix|x)\s*$/i, '');
  base = base.replace(/\s+\d{1,2}\s*$/, '');
  base = base.replace(/\s+(상|하|중)\s*$/, '');
  base = base.trim();
  let key = base.replace(/\s+/g, '').toLowerCase();
  if (volume) key += '#' + volume;
  return key;
}
function mergeKey(book) { return stripSubtitle(book['제목']) + '|' + normPublisher(book['출판사']); }
function findByMergeKey(list, title, publisher) {
  const target = mergeKey({ '제목': title, '출판사': publisher });
  return (list || []).find(x => mergeKey(x) === target);
}

function calculateTotal(kData, aData, yData) {
  const bookMap = {};
  const process = (data, sName) => {
    (data || []).forEach(b => {
      const t = (b['제목'] || '').trim();
      if (!t) return;
      const k = mergeKey(b);
      const r = parseInt(b['순위']) || 101;
      const pts = Math.max(0, 101 - r);
      if (!bookMap[k]) { bookMap[k] = { ...b, points: 0, stores: [] }; }
      else {
        const curA = (bookMap[k]['저자'] || ''), newA = (b['저자'] || '');
        if (newA.length > curA.length) bookMap[k]['저자'] = newA;
        if (!bookMap[k]['이미지URL'] && b['이미지URL']) bookMap[k]['이미지URL'] = b['이미지URL'];
        if (!bookMap[k]['LINK'] && b['LINK']) bookMap[k]['LINK'] = b['LINK'];
      }
      bookMap[k].points += pts;
      if (!bookMap[k].stores.includes(sName)) bookMap[k].stores.push(sName);
    });
  };
  process(kData, 'kyobo'); process(aData, 'aladin'); process(yData, 'yes24');
  const sorted = Object.values(bookMap).sort((a, b) => b.points - a.points);
  sorted.forEach((b, i) => { b['순위'] = i + 1; b['순위변동'] = '-'; });
  return sorted;
}

/* ===== 요약 카드 ===== */
function buildSummary(books, isTotal) {
  const ours = books.filter(b => isOurPublisher(b['출판사']));
  const ourCount = ours.length;
  let best = null;
  ours.forEach(b => { const r = parseInt(b['순위']) || 999; if (!best || r < best.r) best = { r, title: b['제목'] }; });
  let topRise = null;
  if (!isTotal) {
    ours.forEach(b => { const d = parseChangeDelta(b['순위변동']); if (d > 0 && (!topRise || d > topRise.d)) topRise = { d, title: b['제목'] }; });
  }
  const catName = currentCat === 'all' ? '' : (CATEGORIES.find(c => c[0]===currentCat)?.[1] || '');
  const scopeLabel = isTotal ? '통합 300점 내'
    : (currentCat !== 'all' ? `${STORE_NAMES[currentStore]} ${catName} 20위 내` : STORE_NAMES[currentStore] + ' 100위 내');
  return `<div class="summary-grid">
    <div class="sum-card pink">
      <div class="sum-label" style="color:#C2185B">${isTotal?'통합 진입':'윌북 진입'}</div>
      <div class="sum-value" style="color:#880E4F">${ourCount}<span class="sum-unit">권</span></div>
      <div class="sum-sub" style="color:#C2185B">${scopeLabel}</div>
    </div>
    <div class="sum-card plain">
      <div class="sum-label" style="color:var(--sub)">최고 순위</div>
      <div class="sum-value">${best?best.r:'–'}<span class="sum-unit">${best?'위':''}</span></div>
      <div class="sum-sub" style="color:var(--mut)">${best?best.title:'진입 없음'}</div>
    </div>
    <div class="sum-card plain">
      <div class="sum-label" style="color:var(--sub)">${isTotal?'윌북 계열':'최대 상승'}</div>
      <div class="sum-value" style="color:${topRise?'#2E7D14':'var(--ink)'}">${isTotal?ourCount:(topRise?'▲'+topRise.d:'–')}${isTotal?'<span class="sum-unit">권</span>':''}</div>
      <div class="sum-sub" style="color:var(--mut)">${isTotal?'전체 통합 성적':(topRise?topRise.title:'상승 없음')}</div>
    </div>
  </div>`;
}

/* ===== 급상승/신규 하이라이트 ===== */
function buildHighlights(books, isTotal) {
  if (isTotal || !books || books.length === 0) return '';
  const risers = books.map(b => ({ book: b, delta: parseChangeDelta(b['순위변동']) })).filter(x => x.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 5);
  const newcomers = books.filter(b => { const v = (b['순위변동'] || '').toString().trim().toUpperCase(); return v === 'NEW' || v === '진입'; }).sort((a, b) => (parseInt(a['순위']) || 99) - (parseInt(b['순위']) || 99)).slice(0, 5);
  const esc = s => (s || '').replace(/"/g, '&quot;');
  const cut = (s, n) => { s = (s || '').toString(); return s.length > n ? s.slice(0, n) + '…' : s; };
  const rowHtml = (b, badgeText, badgeCls) => `<div class="hl-row" data-title="${esc(b['제목'])}" data-author="${esc(b['저자'])}" data-publisher="${esc(b['출판사'])}" onclick="openTrendModal(this)">
      <span class="hl-rank">${parseInt(b['순위'])||'-'}위</span>
      <div class="hl-info"><div class="hl-title" title="${esc(b['제목'])}">${cut(b['제목'],24)}</div><div class="hl-sub">${cut(`${b['저자']||''} · ${b['출판사']||''}`,28)}</div></div>
      <span class="hl-badge ${badgeCls}">${badgeText}</span></div>`;
  const upRows = risers.length ? risers.map(x => rowHtml(x.book, `▲ ${x.delta}`, 'up')).join('') : '<div class="hl-empty">이번 시간엔 급상승 도서가 없어요</div>';
  const newRows = newcomers.length ? newcomers.map(b => rowHtml(b, 'NEW', 'new')).join('') : '<div class="hl-empty">이번 시간엔 신규 진입 도서가 없어요</div>';
  return `<div class="highlight-section"><div class="hl-grid">
    <div class="hl-box up"><div class="hl-box-title">🔥 지금 급상승 TOP 5</div>${upRows}</div>
    <div class="hl-box new"><div class="hl-box-title">✨ 신규 진입</div>${newRows}</div>
  </div></div>`;
}

/* ===== 추이 시계열 ===== */
function getTrendSeries(title) {
  // 서점 탭과 무관하게 항상 세 서점 순위를 한 그래프에 함께 표시
  const ordered = [...historyData];
  const labels = [];
  const series = { kyobo: [], aladin: [], yes24: [] };
  ordered.forEach(entry => {
    labels.push(toShortTime(entry['수집시각']));
    ['kyobo', 'aladin', 'yes24'].forEach(s => {
      const b = findByMergeKey(entry['데이터']?.[s], title, modalBookPublisher);
      series[s].push(b ? parseInt(b['순위']) : null);
    });
  });
  return { labels, series, isTotal: true };
}

function renderTrendChart(title) {
  const wrap = document.getElementById('trendChartView');
  const { labels, series, isTotal } = getTrendSeries(title);
  const hasAnyPoint = Object.values(series).some(arr => arr.some(v => v !== null));
  if (!hasAnyPoint || labels.length === 0) {
    wrap.innerHTML = '<div class="trend-chart-empty">아직 그래프를 그릴 만한<br>과거 데이터가 충분하지 않아요 📭</div>';
    return;
  }
  wrap.innerHTML = '<div class="trend-chart-wrap"><canvas id="trendChartCanvas"></canvas></div>';
  const datasets = Object.entries(series).map(([store, arr]) => ({
    label: STORE_NAMES[store] || store, data: arr,
    borderColor: STORE_COLORS[store], backgroundColor: STORE_COLORS[store] + '18',
    borderWidth: 2.5, pointRadius: 3.5, pointHoverRadius: 6, pointBackgroundColor: '#fff',
    pointBorderColor: STORE_COLORS[store], pointBorderWidth: 2, tension: 0.35, spanGaps: true,
    fill: false
  }));
  if (trendChart) { trendChart.destroy(); trendChart = null; }
  const ctx = document.getElementById('trendChartCanvas').getContext('2d');
  trendChart = new Chart(ctx, {
    type: 'line', data: { labels, datasets },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: isTotal, position: 'bottom', labels: { boxWidth: 10, font: { size: 11, family: 'Pretendard' }, padding: 12 } },
        tooltip: { titleFont: { family: 'Pretendard' }, bodyFont: { family: 'Pretendard' }, callbacks: { label: c => c.parsed.y === null ? `${c.dataset.label}: 차트 아웃` : `${c.dataset.label}: ${c.parsed.y}위` } }
      },
      scales: {
        y: { reverse: true, min: 1, max: 100, ticks: { precision: 0, stepSize: 10, font: { size: 11, family: 'Pretendard' }, color: '#8B95A1', callback: v => v + '위' }, grid: { color: '#F2F4F6' } },
        x: { ticks: { font: { size: 10, family: 'Pretendard' }, color: '#8B95A1', maxRotation: 45, minRotation: 45, autoSkip: true, maxTicksLimit: 8 }, grid: { display: false } }
      }
    }
  });
}

/* ===== 모달: 세 서점 현재 순위 카드 ===== */
function buildStoreRankGrid(title, publisher) {
  const latest = historyData.length ? historyData[historyData.length - 1] : null;
  const getR = (s) => {
    if (!latest) return null;
    const b = findByMergeKey(latest['데이터']?.[s], title, publisher);
    return b ? parseInt(b['순위']) : null;
  };
  const cards = ['kyobo','aladin','yes24'].map(s => {
    const r = getR(s);
    return `<div class="srg-card ${s}">
      <div class="srg-label ${s}">${STORE_NAMES[s]}</div>
      ${r ? `<div class="srg-value" style="color:${STORE_COLORS[s]}">${r}<span class="srg-unit">위</span></div>` : `<div class="srg-value none">–</div>`}
    </div>`;
  }).join('');
  document.getElementById('storeRankGrid').innerHTML = cards;
}

function openTrendModal(el) {
  const title = el.dataset.title;
  const author = el.dataset.author;
  modalBookTitle = title; modalBookAuthor = author;
  modalBookPublisher = el.dataset.publisher || '';
  modalBookIsOurs = isOurPublisher(modalBookPublisher);

  const brand = modalBookIsOurs ? OUR_PUBLISHERS.find(p => modalBookPublisher.includes(p)) : '';
  const badgeRow = document.getElementById('modalBadgeRow');
  badgeRow.innerHTML = brand ? `<span class="our-badge" style="background:${PUB_COLORS[brand]}">${brand}</span>` : `<span style="font-size:12px;color:var(--mut)">${modalBookPublisher||''}</span>`;

  document.getElementById('trendBtnIssues').style.display = modalBookIsOurs ? '' : 'none';
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalAuthor').textContent = author;

  buildStoreRankGrid(title, modalBookPublisher);

  let html = '';
  const limits = [...historyData].reverse().slice(0, 12);
  limits.forEach((entry, idx) => {
    const time = toOnTheHour(entry['수집시각']);
    let rankText = '<span class="trend-rank none">차트 아웃</span>';
    let isTop = false;
    if (currentStore === 'total') {
      const getR = (s) => { const b = findByMergeKey(entry['데이터'][s], title, modalBookPublisher); return b ? parseInt(b['순위']) : null; };
      const kr = getR('kyobo'), ar = getR('aladin'), yr = getR('yes24');
      if (kr || ar || yr) {
        rankText = `<div class="trend-stores">
          ${kr ? `<span class="store-badge-mini" style="background:#4DAC27">교 ${kr}위</span>` : ''}
          ${ar ? `<span class="store-badge-mini" style="background:#A2052C">알 ${ar}위</span>` : ''}
          ${yr ? `<span class="store-badge-mini" style="background:#020287">예 ${yr}위</span>` : ''}</div>`;
        if(kr<=10 || ar<=10 || yr<=10) isTop = true;
      }
    } else {
      const b = findByMergeKey(entry['데이터'][currentStore], title, modalBookPublisher);
      if (b) { const r = parseInt(b['순위']); rankText = `<span class="trend-rank">${r}위</span>`; if(r <= 10) isTop = true; }
    }
    html += `<div class="trend-item ${isTop ? 'is-top' : ''}"><span class="trend-time">${idx === 0 ? '🕒 최신 (현재)' : time}</span>${rankText}</div>`;
  });
  if(limits.length === 0) html = '<div style="padding:20px; text-align:center; color:var(--mut);">과거 데이터가 아직 없습니다.</div>';
  document.getElementById('trendList').innerHTML = html;
  document.getElementById('trendModal').classList.add('show');
  setTrendView('chart');
}

function closeTrendModal() {
  document.getElementById('trendModal').classList.remove('show');
  if (trendChart) { trendChart.destroy(); trendChart = null; }
}

/* ===== 순위 리스트 렌더 ===== */
function renderBooks(books, container) {
  if (!books || books.length === 0) { container.innerHTML = '<div class="error">데이터가 없어요.</div>'; return; }
  const time = books[0]['수집시각'] || '';
  const isTotal = currentStore === 'total';
  let listHtml = '';

  books.forEach(book => {
    const rank = parseInt(book['순위']) || 0;
    const link = book['LINK'] || book['링크'] || '';
    const publisher = book['출판사'] || '';
    const author = book['저자'] || '';
    const imgUrl = book['이미지URL'] || '';
    const pubDate = book['출간일'] || book['출간'] || book['발행일'] || book['출간년월'] || book['date'] || '';
    const titleClean = (book['제목']||'').replace(/"/g, '&quot;');
    const authorClean = author.replace(/"/g, '&quot;');
    const isOurs = isOurPublisher(publisher);
    const ourPubName = isOurs ? OUR_PUBLISHERS.find(p => publisher.includes(p)) : '';
    const pubColor = ourPubName ? PUB_COLORS[ourPubName] : '';
    const pubTint = ourPubName ? PUB_TINTS[ourPubName] : '';

    let storeBadges = '';
    if (isTotal && book.stores) storeBadges = book.stores.map(s => `<span class="store-badge-mini" style="background:${STORE_COLORS[s]}">${STORE_NAMES[s][0]}</span>`).join(' ');

    const badgeHtml = changeBadgeHtml(book['순위변동'] || '', isTotal ? book.points : null);
    const imgContent = imgUrl ? `<img src="${imgUrl}" referrerpolicy="no-referrer" loading="lazy" onerror="this.parentElement.classList.add('skeleton');this.style.display='none';" alt="${titleClean}">` : '';
    // 서지정보 서브라인: 출판사 · 출간년월 (있는 것만)
    const subParts = [publisher, pubDate].filter(Boolean).join(' · ');

    listHtml += `<div class="book-item ${isOurs ? 'highlight' : ''}" data-ours="${isOurs}" data-title="${titleClean}" data-author="${authorClean}" data-publisher="${publisher.replace(/"/g,'&quot;')}" onclick="openTrendModal(this)" ${isOurs?`style="--will-tint:${pubTint}"`:''}>
      <div class="cover ${imgUrl ? '' : 'skeleton'}">
        ${imgContent}
        <span class="rank-badge ${rank<=3?'top3':''}">${rank}</span>
      </div>
      <div class="book-info">
        <div class="bi-top">${badgeHtml}${storeBadges}${isOurs ? `<span class="our-badge" style="background:${pubColor}">${ourPubName}</span>` : ''}</div>
        <div class="book-title">${book['제목']||''}</div>
        ${author ? `<div class="book-author">${author}</div>` : ''}
        ${subParts ? `<div class="book-sub">${subParts}</div>` : ''}
        ${link ? `<div class="book-link"><a href="${link}" target="_blank" onclick="event.stopPropagation()">도서 링크</a></div>` : ''}
      </div>
    </div>`;
  });

  const existingMsg = document.getElementById('empty-msg');
  if (existingMsg) existingMsg.remove();

  const catTabs = buildCatTabs();
  container.innerHTML = `
    ${buildSummary(books, isTotal)}
    ${buildStoreTabs()}
    ${catTabs}
    ${buildHighlights(books, isTotal)}
    <div class="toolbar">
      <span class="time-value">📅 ${toOnTheHour(time)} 기준</span>
      <button class="refresh-btn" onclick="handleRefresh(this)" title="새로고침"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>
    <div class="toolbar">
      <div class="search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--mut)" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3-3"/></svg><input type="text" class="search-input" id="searchInput" placeholder="${isTotal ? '통합차트 검색' : '제목·저자·출판사 검색'}" oninput="handleSearch(event)" value="${searchQuery}"></div>
      <button class="filter-btn ${filterOn ? 'active' : ''}" id="filterBtn" onclick="toggleFilter()">윌북만</button>
    </div>
    <div class="books-list-view">${listHtml}</div>`;

  bindStoreTabs();
  applyFilters();
}

/* 서점 탭 + 분야 탭 (렌더 내부에 삽입) */
function buildStoreTabs() {
  const stores = [['kyobo','교보'],['aladin','알라딘'],['yes24','예스24'],['total','👑 통합']];
  return `<div class="store-tabs">${stores.map(([k,n]) => `<div class="store-tab ${currentStore===k?'active':''}" data-store="${k}">${n}</div>`).join('')}</div>`;
}
const CATEGORIES = [['all','종합'],['humanities','인문'],['essay','에세이'],['economy','경제경영'],['selfhelp','자기계발'],['teen','청소년']];
function buildCatTabs() {
  // 교보·통합 탭에서는 분야 탭을 숨김 (종합 데이터만 존재)
  if (!CAT_STORES.includes(currentStore)) return '';
  return `<div class="cat-tabs">${CATEGORIES.map(([k,n]) => {
    const has = catHasData(currentStore, k);
    const active = currentCat === k;
    const cls = active ? 'active' : (has ? '' : 'disabled');
    const onclick = has ? `setCategory('${k}')` : `alert('${n} 분야는 아직 준비 중입니다')`;
    return `<div class="cat-tab ${cls}" onclick="${onclick}">${n}</div>`;
  }).join('')}</div>`;
}

// 분야 탭 클릭 → 해당 분야 탑20 렌더 (종합이면 원래 CSV 리스트)
function setCategory(key) {
  currentCat = key;
  filterOn = false; searchQuery = '';
  loadLatest();
}
function bindStoreTabs() {
  document.querySelectorAll('.store-tab').forEach(t => t.onclick = () => setStore(t.dataset.store));
}

function renderHistoryList(history) {
  const container = document.getElementById('history-view');
  if (!history || history.length === 0) { container.innerHTML = '<div class="error">지난 차트가 아직 없어요.</div>'; return; }
  let html = buildStoreTabs() + '<div class="history-list">';
  [...history].reverse().forEach((entry, i) => {
    const time = toOnTheHour(entry['수집시각'] || '');
    let topTitle = '데이터 없음'; let hasOurs = false; let ourCount = 0;
    if (currentStore === 'total') {
      const sorted = calculateTotal(entry['데이터']['kyobo'], entry['데이터']['aladin'], entry['데이터']['yes24']);
      if(sorted[0]) topTitle = sorted[0]['제목'];
      ourCount = sorted.filter(b => isOurPublisher(b['출판사'])).length; hasOurs = ourCount > 0;
    } else {
      const data = entry['데이터']?.[currentStore] || [];
      if(data[0]) topTitle = data[0]['제목'];
      ourCount = data.filter(b => isOurPublisher(b['출판사'])).length; hasOurs = ourCount > 0;
    }
    html += `<div class="history-item ${hasOurs ? 'has-ours' : ''}" onclick="showHistoryDetail(${history.length-1-i})">
      <div><div class="history-time">${time} 기준</div><div class="history-top">1위: ${topTitle}</div>${hasOurs ? `<span class="history-our-badge">윌북 계열 ${ourCount}권</span>` : ''}</div>
      <span style="color:var(--mut);font-size:18px">›</span></div>`;
  });
  container.innerHTML = html + '</div>';
  bindStoreTabs();
}

function showHistoryDetail(index) {
  filterOn = false; searchQuery = ''; const entry = historyData[index]; if (!entry) return;
  const container = document.getElementById('history-view'); container.innerHTML = '';
  const btn = document.createElement('button'); btn.className = 'back-btn'; btn.innerHTML = '← 목록으로';
  btn.onclick = () => renderHistoryList(historyData); container.appendChild(btn);
  const inner = document.createElement('div'); container.appendChild(inner);
  if(currentStore === 'total') { const d = entry['데이터']; renderBooks(calculateTotal(d['kyobo'], d['aladin'], d['yes24']), inner); }
  else { renderBooks(entry['데이터'][currentStore] || [], inner); }
}

function parseCSV(text) {
  const lines = text.trim().split('\n'); if (lines.length < 2) return [];
  const headers = lines[0].replace(/^﻿/, '').split(',');
  return lines.slice(1).map(line => {
    const values = []; let cur = '', inQ = false;
    for (let c of line) { if (c === '"') inQ = !inQ; else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ''; } else cur += c; }
    values.push(cur.trim()); const obj = {};
    headers.forEach((h, i) => obj[h.trim()] = (values[i]||'').replace(/\r/g,''));
    return obj;
  });
}

async function fetchWithRetry(url, retries = 3) {
  for (let i = 0; i < retries; i++) {
    try { const res = await fetch(url, { cache: 'no-store' }); if (!res.ok) throw new Error('서버 응답 오류'); return res; }
    catch (err) { if (i === retries - 1) throw err; await new Promise(r => setTimeout(r, 1000)); }
  }
}

async function loadLatest() {
  const container = document.getElementById('latest-view');
  if (container.innerHTML.includes('loading')) container.innerHTML = '<div class="loading">불러오는 중...</div>';

  // 📚 분야 선택 상태 (종합이 아니고, 분야 지원 서점) → categories.json 데이터 렌더
  if (currentCat !== 'all' && CAT_STORES.includes(currentStore)) {
    const list = (categoriesData && categoriesData[currentStore] && categoriesData[currentStore][currentCat]) || [];
    renderBooks(list, container);
    return;
  }

  try {
    if (currentStore === 'total') {
      const [kRes, aRes, yRes] = await Promise.all([
        fetchWithRetry(RAW + CSV_FILES['kyobo'] + '?t=' + Date.now()),
        fetchWithRetry(RAW + CSV_FILES['aladin'] + '?t=' + Date.now()),
        fetchWithRetry(RAW + CSV_FILES['yes24'] + '?t=' + Date.now())
      ]);
      const sorted = calculateTotal(parseCSV(await kRes.text()), parseCSV(await aRes.text()), parseCSV(await yRes.text()));
      renderBooks(sorted, container);
    } else {
      const res = await fetchWithRetry(RAW + CSV_FILES[currentStore] + '?t=' + Date.now());
      renderBooks(parseCSV(await res.text()), container);
    }
  } catch { container.innerHTML = '<div class="error">데이터를 완벽하게 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</div>'; }
}

async function loadHistory() {
  try { const res = await fetchWithRetry(RAW + 'history.json?t=' + Date.now()); historyData = await res.json(); }
  catch { historyData = []; }
}

setStoreColor('kyobo');
loadHistory().then(loadLatest);
loadIssues();
loadCategories();
</script>
